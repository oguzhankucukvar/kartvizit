<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1a2c5b;
    --navy-dark: #0f1c3a;
    --navy-deep: #0a1428;
    --red: #cc0000;
    --gold: #c9a84c;
    --gold-soft: rgba(201,168,76,0.35);
    --white: #ffffff;
    --text-light: #9aa9c7;
    --wa: #25d366;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    font-family: 'Montserrat', system-ui, sans-serif;
    color: var(--white);
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,168,76,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy-dark), var(--navy-deep));
  }

  .card {
    width: 100%;
    min-width: 0;          /* flex içinde içerik kadar genişleyip taşmasın */
    max-width: 420px;
    background: var(--navy);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(201,168,76,0.22);
    animation: fadeUp 0.7s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── Fotoğraf + isim ───────────────────────────── */
  .hero {
    position: relative;
    aspect-ratio: 840 / 900;
    max-height: 470px;
    width: 100%;
    background: #3c332c;
  }
  .hero::before { /* üst ince kırmızı→altın çizgi */
    content: '';
    position: absolute; inset: 0 0 auto 0;
    height: 4px; z-index: 2;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }
  .hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 12%;
    display: block;
  }
  .hero::after { /* fotoğrafın alt kısmı laciverte erir */
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(26,44,91,0) 40%,
      rgba(26,44,91,0.55) 66%,
      rgba(26,44,91,0.92) 84%,
      var(--navy) 100%);
  }
  .hero-text {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 1;
    padding: 0 28px 22px;
    animation: fadeUp 0.8s 0.15s ease both;
  }
  .name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.3px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.45);
  }
  .title-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .company {
    display: inline-flex;
    align-items: center;
    background: var(--red);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 6px;
  }

  /* ── Ana düğmeler ─────────────────────────────── */
  .actions {
    padding: 6px 24px 0;
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 10px;
    animation: fadeUp 0.8s 0.25s ease both;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 50px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    text-decoration: none;
    transition: transform 0.15s ease, filter 0.15s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover  { filter: brightness(1.08); }
  .btn svg { width: 19px; height: 19px; flex-shrink: 0; }
  .btn-call { background: var(--red); box-shadow: 0 8px 20px rgba(204,0,0,0.28); }
  .btn-wa   { background: var(--wa); color: #06351b; box-shadow: 0 8px 20px rgba(37,211,102,0.22); }
  .btn-save {
    grid-column: 1 / -1;
    background: transparent;
    border: 1.5px solid var(--gold-soft);
    color: var(--gold);
  }
  .btn-save:hover { background: rgba(201,168,76,0.08); filter: none; }

  /* ── İletişim satırları ───────────────────────── */
  .divider {
    margin: 22px 24px 0;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-soft), transparent);
  }
  .contacts {
    padding: 16px 24px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeUp 0.8s 0.35s ease both;
  }
  .contact-item {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
    color: var(--white);
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .contact-item:hover { background: rgba(255,255,255,0.09); border-color: var(--gold-soft); transform: translateX(3px); }
  .icon-box {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: rgba(255,255,255,0.07);
  }
  .icon-box svg { width: 18px; height: 18px; }
  .contact-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-light);
  }
  .contact-value {
    margin-top: 2px;
    font-size: 13.5px;
    font-weight: 500;
    word-break: break-word;
  }

  /* ── Sosyal medya ─────────────────────────────── */
  .social {
    padding: 14px 24px 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 10px;
    animation: fadeUp 0.8s 0.45s ease both;
  }
  .social a {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 12px 4px 10px;
    border-radius: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
    color: var(--text-light);
    text-decoration: none;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .social a:hover { background: rgba(255,255,255,0.09); border-color: var(--gold-soft); color: var(--white); }
  .social svg { width: 22px; height: 22px; }

  /* ── Alt bilgi ────────────────────────────────── */
  .footer {
    margin-top: 20px;
    padding: 16px 24px 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .tagline {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--text-light);
  }
  .remax-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--gold);
    opacity: 0.8;
    white-space: nowrap;
  }

  @media (max-width: 360px) {
    .name { font-size: 24px; }
    .actions, .contacts, .social { padding-left: 18px; padding-right: 18px; }
    .hero-text { padding: 0 20px 18px; }
  }
</style>
